[project]
name = "dbmask"
version = "0.1.0"
description = "Deterministic, config-driven masking of a restored production database copy"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ali Raza", email = "thealirazadev@gmail.com" }]
# Exact pins are mandatory. Faker in particular: its provider data changes between
# releases, which would silently change masked output for the same secret and input.
dependencies = [
    "click==8.4.2",
    "sqlalchemy==2.0.51",
    "faker==40.36.0",
    "psycopg[binary]==3.3.4",
    "pymysql==1.2.0",
]

[project.scripts]
dbmask = "dbmask.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.0",
    "black==26.5.1",
    "mypy==2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbmask"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
packages = ["dbmask"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live database from docker-compose.test.yml"]
